<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Festa dos Números</title>
<style>
  :root {
    --pink: #ff5fa8;
    --orange: #ff9f1c;
    --yellow: #ffd60a;
    --green: #2ec4b6;
    --blue: #3a86ff;
    --purple: #8338ec;
    --ink: #3b1f5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  body {
    background: linear-gradient(135deg, #ff9ad5, #ffd36e, #7ee8fa, #b69cff, #ff9ad5);
    background-size: 400% 400%;
    animation: bgmove 18s ease infinite;
  }
  @keyframes bgmove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating background shapes */
  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-shapes span {
    position: absolute; font-size: 42px; opacity: .35;
    animation: float 9s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(20deg); }
  }

  .screen {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .hidden { display: none !important; }

  /* Start screen */
  .title {
    font-size: clamp(44px, 13vw, 84px); font-weight: 900; line-height: .95; text-align: center;
    margin: 0 0 8px;
    letter-spacing: 1px;
  }
  .title span { display: inline-block; animation: bounce 1.4s ease-in-out infinite; text-shadow: 0 5px 0 rgba(0,0,0,.15); -webkit-text-stroke: 2px #fff; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .mascot { font-size: clamp(90px, 28vw, 150px); animation: wiggle 2.2s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(0,0,0,.12)); }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.05); } }
  .play-btn {
    margin-top: 18px;
    font: inherit; font-size: clamp(34px, 10vw, 52px); font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #4ade80, #16a34a);
    border: none; border-radius: 999px; padding: 16px 54px;
    box-shadow: 0 10px 0 #0f7a36, 0 16px 30px rgba(0,0,0,.25);
    animation: pulse 1.2s ease-in-out infinite;
    cursor: pointer;
  }
  .play-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #0f7a36; }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.07; } }
  .levels { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .level {
    font: inherit; font-size: 22px; font-weight: 800; color: var(--ink);
    background: rgba(255,255,255,.75); border: 4px solid #fff; border-radius: 20px;
    padding: 8px 16px; cursor: pointer;
  }
  .level.active { background: var(--yellow); border-color: var(--orange); transform: scale(1.08); }
  .note { margin-top: 16px; font-size: 15px; background: rgba(255,255,255,.7); padding: 8px 14px; border-radius: 14px; max-width: 420px; text-align: center; }

  /* Game screen */
  .topbar {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
  }
  .icon-btn {
    font-size: 30px; width: 58px; height: 58px; border-radius: 50%;
    border: 4px solid #fff; background: rgba(255,255,255,.8);
    box-shadow: 0 5px 0 rgba(0,0,0,.15); cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  .icon-btn:active { transform: translateY(4px); box-shadow: none; }
  .stars {
    font-size: 26px; font-weight: 900; background: rgba(255,255,255,.85);
    border: 4px solid #fff; border-radius: 999px; padding: 6px 16px;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    display: flex; align-items: center; gap: 6px;
  }
  .stars .star { display: inline-block; }
  .stars .star.pop { animation: starpop .6s ease; }
  @keyframes starpop { 0% { transform: scale(1); } 40% { transform: scale(1.9) rotate(30deg); } 100% { transform: scale(1); } }

  .question {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,.88); border: 6px solid #fff; border-radius: 34px;
    padding: 14px 26px 18px; box-shadow: 0 10px 0 rgba(0,0,0,.1);
    margin-bottom: 7vh; text-align: center; cursor: pointer;
    animation: popin .5s cubic-bezier(.3,1.6,.5,1);
  }
  .question .who { font-size: 64px; line-height: 1; animation: wiggle 2.2s ease-in-out infinite; }
  .question .txt { font-size: clamp(26px, 7.5vw, 40px); font-weight: 900; }
  .question .txt b { color: var(--pink); font-size: 1.25em; }
  .question .hint { font-size: 16px; opacity: .6; font-weight: 700; }
  @keyframes popin { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .options { display: flex; gap: 4vw; justify-content: center; width: 100%; max-width: 640px; }
  .opt {
    flex: 1 1 0; max-width: 190px; aspect-ratio: 1 / 1.1;
    font: inherit; font-weight: 900; color: #fff;
    font-size: clamp(64px, 20vw, 120px);
    border: 6px solid #fff; border-radius: 32px;
    box-shadow: 0 12px 0 rgba(0,0,0,.22), 0 18px 26px rgba(0,0,0,.18);
    text-shadow: 0 5px 0 rgba(0,0,0,.2);
    cursor: pointer; padding: 0;
    animation: popin .5s cubic-bezier(.3,1.6,.5,1) both;
    transition: transform .12s, opacity .3s, filter .3s;
  }
  .opt:nth-child(2) { animation-delay: .08s; }
  .opt:nth-child(3) { animation-delay: .16s; }
  .opt:active { transform: translateY(8px) scale(.97); box-shadow: 0 4px 0 rgba(0,0,0,.22); }
  .opt.c0 { background: linear-gradient(180deg, #ff7eb9, #ff3d8b); }
  .opt.c1 { background: linear-gradient(180deg, #5eb8ff, #2f6fff); }
  .opt.c2 { background: linear-gradient(180deg, #ffd23f, #ff9a00); }
  .opt.c3 { background: linear-gradient(180deg, #6ee7b7, #10b981); }
  .opt.c4 { background: linear-gradient(180deg, #c084fc, #7c3aed); }
  .opt.c5 { background: linear-gradient(180deg, #fb923c, #ea580c); }
  .opt.wrong { animation: shake .5s ease; filter: grayscale(1) brightness(1.1); opacity: .45; pointer-events: none; }
  .opt.right { animation: winner .9s ease forwards; z-index: 3; }
  .opt.fade { opacity: 0; transform: scale(.6); pointer-events: none; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-14px) rotate(-6deg); }
    40% { transform: translateX(14px) rotate(6deg); }
    60% { transform: translateX(-10px) rotate(-3deg); }
    80% { transform: translateX(10px) rotate(3deg); }
  }
  @keyframes winner {
    0% { transform: scale(1); }
    30% { transform: scale(1.3) rotate(-8deg); }
    60% { transform: scale(1.2) rotate(8deg); }
    100% { transform: scale(1.15); }
  }

  /* Celebration card */
  .celebrate {
    position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    pointer-events: none; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 36px; padding: 16px 20px 20px;
    width: min(92vw, 460px);
    box-shadow: 0 14px 0 rgba(0,0,0,.12), 0 20px 50px rgba(0,0,0,.25);
    border: 8px solid var(--yellow);
    text-align: center;
    animation: popin .55s cubic-bezier(.3,1.6,.5,1);
    pointer-events: auto;
  }
  .card .big {
    font-size: clamp(90px, 30vw, 150px); font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #ff3d8b, #8338ec);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 0 rgba(0,0,0,.12));
    animation: bounce 1s ease-in-out infinite;
  }
  .card .dots { font-size: clamp(20px, 6vw, 28px); line-height: 1.25; margin: 2px 0 10px; letter-spacing: 2px; }
  .card .dots span { display: inline-block; animation: popin .35s cubic-bezier(.3,1.6,.5,1) both; }
  .lang {
    display: flex; align-items: center; gap: 12px;
    font-size: clamp(22px, 6.5vw, 32px); font-weight: 900;
    padding: 8px 14px; border-radius: 20px; margin: 6px 0;
    background: #f4f0ff; transition: transform .2s, background .2s;
    opacity: .55;
  }
  .lang .flag { font-size: 1.3em; }
  .lang .sub { font-size: .6em; opacity: .65; font-weight: 700; margin-left: auto; }
  .lang.on { background: #ffe66d; transform: scale(1.06); opacity: 1; }
  .lang.done { opacity: 1; }

  /* Balloons */
  #fx { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .balloon-layer { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .balloon {
    position: absolute; bottom: -180px; width: 70px; height: 86px;
    border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
    pointer-events: auto; cursor: pointer;
    animation: rise linear forwards;
    box-shadow: inset -10px -12px 0 rgba(0,0,0,.12);
  }
  .balloon::before {
    content: ""; position: absolute; top: 14px; left: 16px; width: 14px; height: 22px;
    background: rgba(255,255,255,.6); border-radius: 50%; transform: rotate(25deg);
  }
  .balloon::after {
    content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 70px;
    background: rgba(80,60,90,.5); transform: translateX(-50%);
  }
  .balloon .knot {
    position: absolute; left: 50%; bottom: -8px; width: 12px; height: 10px; transform: translateX(-50%);
    clip-path: polygon(50% 0, 100% 100%, 0 100%); background: inherit;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(-4deg); }
    25% { transform: translateY(-30vh) translateX(18px) rotate(4deg); }
    50% { transform: translateY(-60vh) translateX(-14px) rotate(-4deg); }
    75% { transform: translateY(-90vh) translateX(14px) rotate(4deg); }
    100% { transform: translateY(-130vh) translateX(0) rotate(-2deg); }
  }
  .poof {
    position: absolute; font-size: 44px; pointer-events: none;
    animation: poof .5s ease-out forwards;
  }
  @keyframes poof { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

  .milestone {
    position: fixed; left: 0; right: 0; top: 16%; z-index: 8; text-align: center;
    font-size: clamp(40px, 12vw, 72px); font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px var(--purple);
    text-shadow: 0 6px 0 var(--purple);
    animation: popin .6s cubic-bezier(.3,1.6,.5,1);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-shapes" id="bgShapes"></div>
<canvas id="fx"></canvas>
<div class="balloon-layer" id="balloons"></div>

<!-- START SCREEN -->
<section class="screen" id="start">
  <div class="mascot">🦄</div>
  <h1 class="title" id="title"></h1>
  <button class="play-btn" id="playBtn">▶ JOGAR</button>
  <div class="levels" id="levels">
    <button class="level" data-max="5">1 – 5</button>
    <button class="level active" data-max="10">1 – 10</button>
    <button class="level" data-max="20">1 – 20</button>
  </div>
  <button class="level" id="testBtn" style="margin-top:16px">🔊 Testar som</button>
  <div class="note hidden" id="testStatus"></div>
  <div class="note hidden" id="voiceNote"></div>
</section>

<!-- GAME SCREEN -->
<section class="screen hidden" id="game">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Início">🏠</button>
    <div class="stars"><span class="star" id="starIcon">⭐</span><span id="score">0</span></div>
    <button class="icon-btn" id="repeatBtn" aria-label="Repetir">🔊</button>
  </div>

  <div class="question" id="question">
    <div class="who" id="who">🐻</div>
    <div class="txt">Qual é o número <b id="qWord">cinco</b>?</div>
    <div class="hint">toque aqui para ouvir de novo 👂</div>
  </div>

  <div class="options" id="options"></div>
</section>

<div class="celebrate hidden" id="celebrate">
  <div class="card">
    <div class="big" id="bigNum">5</div>
    <div class="dots" id="dots"></div>
    <div class="lang" id="lPt"><span class="flag">🇧🇷</span><span id="wPt">cinco</span></div>
    <div class="lang" id="lEn"><span class="flag">🇺🇸</span><span id="wEn">five</span></div>
    <div class="lang" id="lJa"><span class="flag">🇯🇵</span><span id="wJa">ご</span><span class="sub" id="wRo">go</span></div>
  </div>
</div>

<script>
(() => {
  // ---------- DATA ----------
  const PT = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez",
    "onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove","vinte"];
  const EN = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
    "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
  const JA = ["ゼロ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう","じゅう",
    "じゅういち","じゅうに","じゅうさん","じゅうよん","じゅうご","じゅうろく","じゅうなな","じゅうはち","じゅうきゅう","にじゅう"];
  const RO = ["zero","ichi","ni","san","yon","go","roku","nana","hachi","kyuu","juu",
    "juu-ichi","juu-ni","juu-san","juu-yon","juu-go","juu-roku","juu-nana","juu-hachi","juu-kyuu","ni-juu"];
  const ANIMALS = ["🐻","🐶","🐱","🐰","🦊","🐼","🐨","🐯","🦁","🐸","🐵","🐷","🐧","🐥","🦄","🐙"];
  const THINGS = ["🍎","🍓","⭐","🎈","🌸","🐞","🍭","🦋","🍩","🐟","🌈","🍒"];
  const BALLOON_COLORS = ["#ff3d8b","#3a86ff","#ffbe0b","#2ec4b6","#8338ec","#fb5607","#ff006e","#06d6a0"];

  // ---------- STATE ----------
  let maxNum = 10;
  let target = 0, lastTarget = -1;
  let score = 0, streak = 0;
  let locked = false;
  let roundId = 0;

  const $ = id => document.getElementById(id);

  // ---------- BACKGROUND / TITLE ----------
  const bgEmojis = ["1️⃣","2️⃣","3️⃣","⭐","🎈","🌈","✨","🍭","☁️","🎉"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.textContent = bgEmojis[i % bgEmojis.length];
    s.style.left = Math.random() * 95 + "vw";
    s.style.top = Math.random() * 95 + "vh";
    s.style.animationDelay = (-Math.random() * 9) + "s";
    s.style.fontSize = (30 + Math.random() * 30) + "px";
    $("bgShapes").appendChild(s);
  }
  const titleColors = ["#ff3d8b","#ff9a00","#ffbe0b","#10b981","#3a86ff","#8338ec"];
  "Festa dos Números".split("").forEach((ch, i) => {
    if (ch === " ") { $("title").appendChild(document.createElement("br")); return; }
    const sp = document.createElement("span");
    sp.textContent = ch;
    sp.style.color = titleColors[i % titleColors.length];
    sp.style.animationDelay = (i * 0.08) + "s";
    $("title").appendChild(sp);
  });

  // ---------- AUDIO (Web Audio, no files) ----------
  let actx = null, master = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);
    }
    if (actx.state !== "running") { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  // iPhone: make sound play even with the silent switch on
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

  // A looping silent <audio> puts iOS into "playback" mode (ignores the mute switch)
  let silentEl = null;
  function silentWavUrl() {
    const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
    d.setUint32(24, rate, true); d.setUint32(28, rate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
    w(36, "data"); d.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  // Must be called inside a real tap (click / touchend)
  function unlockAudio() {
    try {
      const ctx = audio();
      // play one silent sample: the classic unlock
      const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) {}
    try {
      if (!silentEl) {
        silentEl = document.createElement("audio");
        silentEl.src = silentWavUrl(); silentEl.loop = true;
        silentEl.setAttribute("playsinline", ""); silentEl.setAttribute("x-webkit-airplay", "deny");
      }
      if (silentEl.paused) { const p = silentEl.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  }
  ["touchend", "click", "keydown"].forEach(ev =>
    document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  function bell(freq, t, dur = 0.5, vol = 0.25, type = "sine") {
    const ctx = audio();
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.3;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  // The "addictive" win jingle: sparkly ascending arpeggio, climbing a little each streak
  function winJingle() {
    const ctx = audio();
    const now = ctx.currentTime + 0.02;
    const shift = Math.pow(2, (Math.min(streak - 1, 7)) / 12); // rises with streak
    const base = 523.25 * shift; // C5
    const notes = [1, 1.25, 1.5, 2]; // C E G C
    notes.forEach((m, i) => bell(base * m, now + i * 0.085, 0.45, 0.22, "triangle"));
    // final shiny chord
    [2, 2.5, 3].forEach(m => bell(base * m, now + 0.36, 0.9, 0.12, "sine"));
    // sparkles
    for (let i = 0; i < 6; i++) bell(base * 4 * (1 + Math.random() * 0.5), now + 0.4 + i * 0.05, 0.18, 0.05, "sine");
  }
  function popSound() {
    const ctx = audio();
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(900 + Math.random() * 400, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.12);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
  }
  function fanfare() {
    const ctx = audio();
    const t = ctx.currentTime + 0.05;
    [523, 659, 784, 659, 784, 1047].forEach((f, i) => bell(f, t + i * 0.12, 0.5, 0.18, "square"));
  }

  // ---------- SPEECH ----------
  const synth = window.speechSynthesis;
  let voices = [];
  function loadVoices() { voices = synth ? synth.getVoices() : []; checkVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function pickVoice(lang) {
    const want = lang.toLowerCase();
    const norm = v => v.lang.toLowerCase().replace("_", "-");
    const prefix = want.split("-")[0];
    const exact = voices.filter(v => norm(v) === want);
    const near = voices.filter(v => norm(v).startsWith(prefix));
    const list = exact.length ? exact : near;
    // prefer nicer voices when available
    const good = list.find(v => /google|natural|premium|enhanced|luciana|samantha|kyoko|felipe/i.test(v.name));
    return good || list[0] || null;
  }
  function hasLang(lang) { return voices.some(v => v.lang.toLowerCase().startsWith(lang)); }

  const keepAlive = []; // Chrome bug: utterances get garbage-collected and go silent
  let speechToken = 0;
  function speak(text, lang, rate = 0.85) {
    return new Promise(resolve => {
      if (!synth) return setTimeout(resolve, 600);
      if (!voices.length) voices = synth.getVoices();
      const u = new SpeechSynthesisUtterance(text);
      keepAlive.push(u); if (keepAlive.length > 20) keepAlive.shift();
      u.lang = lang;
      const v = pickVoice(lang);
      if (v) u.voice = v;
      u.rate = rate; u.pitch = 1.15; u.volume = 1;
      let done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      u.onend = finish; u.onerror = finish;
      // safety net: some phones never fire onend
      const timer = setTimeout(finish, 2500 + text.length * 200);
      try { synth.resume(); } catch (e) {}
      synth.speak(u);
    });
  }
  // Cancel only if something is talking, then give the engine a moment
  // (speak() right after cancel() is silently dropped on many phones)
  function stopSpeech() {
    if (synth && (synth.speaking || synth.pending)) { synth.cancel(); return wait(120); }
    return Promise.resolve();
  }

  function checkVoices() {
    const note = $("voiceNote");
    if (!synth) { note.textContent = "⚠️ Este navegador não tem voz. Tente o Chrome ou o Safari."; note.classList.remove("hidden"); return; }
    if (!voices.length) return;
    const missing = [];
    if (!hasLang("pt")) missing.push("português");
    if (!hasLang("en")) missing.push("inglês");
    if (!hasLang("ja")) missing.push("japonês");
    if (missing.length) {
      note.textContent = "💡 Para ouvir em " + missing.join(", ") +
        ", instale a voz nas configurações do celular (Fala / Texto para voz).";
      note.classList.remove("hidden");
    } else note.classList.add("hidden");
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- GAME ----------
  function rand(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function newQuestion() {
    roundId++;
    locked = false;
    $("celebrate").classList.add("hidden");
    do { target = 1 + rand(maxNum); } while (target === lastTarget && maxNum > 1);
    lastTarget = target;

    const opts = new Set([target]);
    while (opts.size < 3) opts.add(1 + rand(maxNum));
    const list = shuffle([...opts]);
    const colors = shuffle([0,1,2,3,4,5]);

    $("qWord").textContent = PT[target];
    $("who").textContent = ANIMALS[rand(ANIMALS.length)];
    const q = $("question");
    q.style.animation = "none"; void q.offsetWidth; q.style.animation = "";

    const box = $("options");
    box.innerHTML = "";
    list.forEach((n, i) => {
      const b = document.createElement("button");
      b.className = "opt c" + colors[i];
      b.textContent = n;
      b.dataset.n = n;
      b.addEventListener("click", () => choose(b, n));
      box.appendChild(b);
    });

    askQuestion();
  }

  async function askQuestion() {
    const tok = ++speechToken;
    await stopSpeech();
    if (tok !== speechToken) return;
    speak("Qual é o número " + PT[target] + "?", "pt-BR", 0.9);
  }

  async function choose(btn, n) {
    if (locked) return;
    audio(); // make sure audio is unlocked
    if (n !== target) {
      // wrong: no sound, just a little wiggle
      streak = 0;
      btn.classList.add("wrong");
      return;
    }
    locked = true;
    const myRound = roundId;
    speechToken++;
    await stopSpeech();
    streak++; score++;
    $("score").textContent = score;
    const st = $("starIcon"); st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop");

    btn.classList.add("right");
    [...$("options").children].forEach(b => { if (b !== btn) b.classList.add("fade"); });

    winJingle();
    confettiBurst(btn);
    launchBalloons(score % 5 === 0 ? 14 : 7);

    const milestone = score % 5 === 0;
    if (milestone) setTimeout(() => { fanfare(); showMilestone(); }, 500);

    await wait(700);
    if (myRound !== roundId) return;
    showCard(target);

    const rows = [
      ["lPt", PT[target], "pt-BR"],
      ["lEn", EN[target], "en-US"],
      ["lJa", JA[target], "ja-JP"],
    ];
    await wait(450);
    for (const [id, word, lang] of rows) {
      if (myRound !== roundId) return;
      const el = $(id);
      el.classList.add("on");
      await speak(word, lang, 0.8);
      el.classList.remove("on"); el.classList.add("done");
      await wait(250);
    }
    if (myRound !== roundId) return;
    await wait(900);
    if (myRound !== roundId) return;
    newQuestion();
  }

  function showCard(n) {
    $("bigNum").textContent = n;
    $("wPt").textContent = PT[n];
    $("wEn").textContent = EN[n];
    $("wJa").textContent = JA[n];
    $("wRo").textContent = RO[n];
    ["lPt","lEn","lJa"].forEach(id => $(id).classList.remove("on","done"));
    const thing = THINGS[rand(THINGS.length)];
    const dots = $("dots"); dots.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.textContent = thing;
      s.style.animationDelay = (i * 0.05) + "s";
      dots.appendChild(s);
      if (n > 10 && i === 9) dots.appendChild(document.createElement("br"));
    }
    const c = $("celebrate");
    c.classList.remove("hidden");
    const card = c.querySelector(".card");
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  }

  function showMilestone() {
    const words = ["Muito bem! 🎉","Incrível! 🌟","Parabéns! 🏆","Uau! 🚀","Super! 💖"];
    const m = document.createElement("div");
    m.className = "milestone";
    m.textContent = words[rand(words.length)];
    document.body.appendChild(m);
    setTimeout(() => m.remove(), 1800);
  }

  // ---------- BALLOONS ----------
  function launchBalloons(count) {
    const layer = $("balloons");
    for (let i = 0; i < count; i++) {
      const b = document.createElement("div");
      b.className = "balloon";
      const color = BALLOON_COLORS[rand(BALLOON_COLORS.length)];
      b.style.background = color;
      b.style.left = (Math.random() * 88) + "vw";
      const size = 0.75 + Math.random() * 0.5;
      b.style.width = 70 * size + "px"; b.style.height = 86 * size + "px";
      b.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
      b.style.animationDelay = (Math.random() * 0.8) + "s";
      const knot = document.createElement("div"); knot.className = "knot"; b.appendChild(knot);
      b.addEventListener("pointerdown", e => {
        e.preventDefault(); e.stopPropagation();
        popSound();
        const r = b.getBoundingClientRect();
        const p = document.createElement("div");
        p.className = "poof"; p.textContent = "💥";
        p.style.left = (r.left + r.width / 2 - 22) + "px";
        p.style.top = (r.top + r.height / 2 - 22) + "px";
        layer.appendChild(p);
        setTimeout(() => p.remove(), 500);
        miniBurst(r.left + r.width / 2, r.top + r.height / 2, color);
        b.remove();
      });
      b.addEventListener("animationend", () => b.remove());
      layer.appendChild(b);
    }
  }

  // ---------- CONFETTI (canvas) ----------
  const cv = $("fx"), cx = cv.getContext("2d");
  let parts = [], animating = false;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const CONF_COLORS = ["#ff3d8b","#3a86ff","#ffbe0b","#2ec4b6","#8338ec","#fb5607","#ffffff"];
  function addParticles(x, y, n, colors, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = power * (0.4 + Math.random());
      parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.6,
        r: 4 + Math.random() * 6, c: colors[rand(colors.length)],
        rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
        life: 1, shape: rand(3)
      });
    }
    if (!animating) { animating = true; requestAnimationFrame(tick); }
  }
  function confettiBurst(btn) {
    const r = btn.getBoundingClientRect();
    addParticles(r.left + r.width / 2, r.top + r.height / 2, 90, CONF_COLORS, 11);
    addParticles(innerWidth * 0.1, innerHeight, 40, CONF_COLORS, 14);
    addParticles(innerWidth * 0.9, innerHeight, 40, CONF_COLORS, 14);
  }
  function miniBurst(x, y, color) { addParticles(x, y, 22, [color, "#fff", "#ffd60a"], 7); }

  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += 0.3; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.008;
      cx.save();
      cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c;
      if (p.shape === 0) cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      else if (p.shape === 1) { cx.beginPath(); cx.arc(0, 0, p.r * .7, 0, Math.PI * 2); cx.fill(); }
      else star(p.r);
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { animating = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function star(r) {
    cx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .45 : r;
      const a = i * Math.PI / 5 - Math.PI / 2;
      cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    cx.closePath(); cx.fill();
  }

  // ---------- UI WIRING ----------
  document.querySelectorAll(".level[data-max]").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".level[data-max]").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      maxNum = +b.dataset.max;
      audio(); bell(660 + maxNum * 20, audio().currentTime, 0.25, 0.15, "triangle");
    });
  });

  $("playBtn").addEventListener("click", async () => {
    unlockAudio();
    // Speaking a real sentence inside the tap is what unlocks the voice on phones
    const hello = speak("Vamos jogar!", "pt-BR", 0.95);
    bell(784, audio().currentTime + 0.01, 0.3, 0.2, "triangle");
    $("start").classList.add("hidden");
    $("game").classList.remove("hidden");
    score = 0; streak = 0; lastTarget = -1;
    $("score").textContent = 0;
    launchBalloons(5);
    await hello;
    newQuestion();
  });

  $("testBtn").addEventListener("click", async () => {
    unlockAudio();
    const st = $("testStatus");
    st.classList.remove("hidden");
    streak = 1; winJingle(); streak = 0;
    if (!synth) {
      st.innerHTML = "🔔 Você ouviu o sininho?<br>❌ Este navegador não tem voz. Abra o arquivo no <b>Chrome</b> (Android) ou no <b>Safari</b> (iPhone), não dentro do WhatsApp/Drive.";
      return;
    }
    st.innerHTML = "🔔 Você ouviu o sininho e a voz?<br>Se não ouviu: aumente o volume 🔊 e, no iPhone, desligue o modo silencioso 🔕.";
    await wait(900);
    await speak("Olá! Um, dois, três!", "pt-BR", 0.95);
  });

  $("homeBtn").addEventListener("click", () => {
    roundId++; stopSpeech();
    $("celebrate").classList.add("hidden");
    $("game").classList.add("hidden");
    $("start").classList.remove("hidden");
  });
  $("repeatBtn").addEventListener("click", () => { if (!locked) askQuestion(); });
  $("question").addEventListener("click", () => { if (!locked) askQuestion(); });

  document.addEventListener("visibilitychange", () => { if (document.hidden) stopSpeech(); });
  document.addEventListener("dblclick", e => e.preventDefault());
})();
</script>
</body>
</html>
